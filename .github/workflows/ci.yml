name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Rebuild TensorFlow.js bundle
        run: npm run build:tfjs
      - name: Verify TensorFlow.js bundle is current
        run: git diff --exit-code -- src/vendor/tfjs.cjs
      - name: Rebuild banner
        run: npm run build:banner
      - name: Verify banner is current
        run: git diff --exit-code -- src/utils/banner.js
      # The model shard is a float16 derivative of the poketwo-ai production checkpoint.
      - name: Verify model bundle
        run: |
          echo "b0f2def7bc81c134f429f30a2ad92e8de9ea3c305a3650dde2b445a402f27ffa  src/data/labels.json" | sha256sum -c -
          echo "bd5ddf9f7a18088bb653298ae83733668fb619a9811e601816c09eddd95ed02e  src/data/model/model.json" | sha256sum -c -
          echo "297da51b9065953acaf935d6b5c69da27b626b9a8dd29fa3b6901dc1b54ebe28  src/data/model/group1-shard1of1.bin" | sha256sum -c -
          node -e "const l = require('./src/data/labels.json'); if (!Array.isArray(l.classes) || l.classes.length !== 1303) { console.error('expected 1303 label classes, got', l.classes?.length); process.exit(1); }"
          node -e "const m = require('./src/data/model/model.json'); const specs = m.weightsManifest.flatMap((g) => g.weights ?? []); if (specs.length !== 25) { console.error('expected 25 weight specs, got', specs.length); process.exit(1); } for (const spec of specs) { if (spec.dtype !== 'float32' || spec.quantization?.dtype !== 'float16') { console.error('expected float32 dtype with float16 quantization on', spec.name); process.exit(1); } }"
