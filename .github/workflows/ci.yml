name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify model bundle matches poketwo-ai production checkpoint
        run: |
          echo "6914c98cd7cb2c38e0a1f4532e3aaa24257af74585a16d9f1eb95b90f3a06851  src/data/labels.json" | sha256sum -c -
          echo "bd914eae6621ce05176847027292824d4f21f50c200d93b34d1c659e819e3f52  src/data/model/group1-shard1of2.bin" | sha256sum -c -
          echo "9bc8cb522e3b676f1306d4f8a8e985fece19fbe8630aeeccb6e3f86619bb00a7  src/data/model/group1-shard2of2.bin" | sha256sum -c -
          node -e "const l = require('./src/data/labels.json'); if (!Array.isArray(l.classes) || l.classes.length !== 1279) { console.error('expected 1279 label classes, got', l.classes?.length); process.exit(1); }"
